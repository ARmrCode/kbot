apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/ARmrCode/kbot.git  
  ref:
    branch: opentelemetry                 
  secretRef:
    name: flux-system                   
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./otel
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
