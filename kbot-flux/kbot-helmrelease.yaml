apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kbot
  namespace: flux-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: kbot
        namespace: flux-system
      version: "*"
  values:
    image:
      registry: ghcr.io
      repository: armrcode/kbot
      tag: "v1.0.0-093ca33-linux-"
      pullPolicy: IfNotPresent
    replicaCount: 1
    ingress:
      enabled: false
    service:
      type: ClusterIP
      port: 8080
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
    serviceAccount:
      create: true
      name: kbot
    secret:
      name: kbot
      tokenKey: token
      tokenName: TELE_TOKEN
  imagePullSecrets:
    - name: ghcr-secret
