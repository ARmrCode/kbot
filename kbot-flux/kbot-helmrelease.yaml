apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kbot
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: kbot
        namespace: flux-system
  values:
    replicaCount: 1
    image:
      registry: ghcr.io
      repository: armrcode/kbot
      tag: v0.0.0
      pullPolicy: IfNotPresent
      os: linux
      arch: ""
    secret:
      name: kbot
      tokenName: TELE_TOKEN
      tokenKey: token
    service:
      type: ClusterIP
      port: 8080
    serviceAccount:
      create: true
      name: ""
    ingress:
      enabled: false
