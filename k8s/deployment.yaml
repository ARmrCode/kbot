apiVersion: apps/v1
kind: Deployment
metadata:
  name: kbot
  namespace: monitoring
  labels:
    app: kbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kbot
  template:
    metadata:
      labels:
        app: kbot
    spec:
      containers:
        - name: kbot
          image: ghcr.io/armrcode/kbot:v1.0.0-6e3b37d-linux-amd64
          command: ["/kbot"]
          args: ["start", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: PROMETHEUS_PORT
              value: "8080"
            - name: TELE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kbot-secret
                  key: TELE_TOKEN
          # Пропускаем liveness/readiness, пока контейнер не стартует стабильно
          livenessProbe: null
          readinessProbe: null
      imagePullSecrets:
        - name: ghcr-secret
