apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.85.0
          ports:
            - containerPort: 4317
            - containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config
              readOnly: true
              subPath: otel-collector-config.yaml
              subPathExpr: otel-collector-config.yaml
          command:
            - "/otelcontribcol"
            - "--config=/etc/otel-collector-config/otel-collector-config.yaml"
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
